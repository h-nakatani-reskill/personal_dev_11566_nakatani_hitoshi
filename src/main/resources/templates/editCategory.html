<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<div class="wrapper">
	<header th:replace="~{header}"></header>
	<main>
	<h1>カテゴリー更新</h1>
	<form th:action="'/categories/'+${category.id}+'/edit'" method="post">
		<table>
			<tr>
				<th>カテゴリーID</th>
				<td th:text="${category.id}"></td>
			</tr>
			<tr>
				<th>カテゴリー名</th>
				<td><input name="name" th:value="${category.name}"></td>
			</tr>
		</table>
		<button>更新</button>
	</form>
	</main>
	<a href="/tasks/add">新規登録</a>
	<a href="/categories">カテゴリー一覧</a>
	<footer th:replace="~{footer}"></footer>
	</div>
</body>
</html>
