<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

	<main class="common-main">

		<form th:action="'/categories/'+${category.id}+'/edit'" method="post">
			<table class="main-table">
				<tr>

					<td th:text="${category.id}" class="addbox"></td>
				</tr>
				<tr>
					<th>カテゴリー名</th>
					<td class="addbox"><input name="name" th:value="${category.name}" class="addessence"></td>

			<button class="button-main">更新</button>
		</form>
	</main>
	<footer th:replace="~{footer}"></footer>
	</div>
