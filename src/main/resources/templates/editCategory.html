<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>カテゴリー更新</h1>
	<form th:action="'/categories/'+${category.id}+'/edit'" method="post">
		<table>
			<tr>
				<th>カテゴリーID</th>
				<td th:text="${category.id}"></td>
			</tr>
			<tr>
				<th>カテゴリー名</th>
				<td><input name="name" th:value="${category.name}"></td>
			</tr>
		</table>
		<button>更新</button>
	</form>
</body>
</html>
