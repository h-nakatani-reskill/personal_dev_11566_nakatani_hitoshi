<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>タスク一覧</title>
</head>
<body>
	<main>
	<h1>タスク一覧</h1>
	<a href="/tasks">タスク一覧</a>
	<a href="/tasks">ビジネス</a>
	<a href="/tasks">プライベート</a>
	
	<table border="1">
		<tr>
			<th>登録日</th>
			<th>タイトル</th>
			<th>カテゴリー</th>
			<th>進捗</th>
			<th>内容</th>
			<th>更新</th>
			<th>削除</th>
		</tr>
		<tr th:each="task:${tasks}">
			<td th:text="${task.recordDay}"></td>
			<td th:text="${task.title}"></td>
			<td th:text="${task.categoryId}"></td>
			<td th:text="${task.progress}"></td>
			<td th:text="${task.memo}"></td>
			<td>
				<form th:action="@{/tasks/{taskId}/edit(taskId=${task.id})}" method="get">
					<button>更新</button>
				</form>
			</td>
			<td>
				<form th:action="@{/tasks/{taskId}/delete(taskId=${task.id})}" method="post">
					<button>削除</button>
				</form>
			</td>
		</tr>
	</table>
	</main>
	<a href="/tasks/add">新規登録</a>
	<a href="/category">カテゴリー一覧</a>

</body>
</html>
