<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>タスク一覧</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<div class="wrapper">
	<header th:replace="~{header}"></header>
	<main>
		<h1>お薬一覧</h1>
		<a href="/tasks/add">新規登録</a>
		<a th:each="category:${categories}"
			th:href="@{/tasks(categoryId=${category.id})}"
			th:text="${category.name}"
			style="margin-right: 5px;"></a>
		<table border="1">
			<tr>
				<th>もらった日</th>
				<th>種類</th>
				<th>残量</th>
				<th>服用量</th>
				<th>服用時間</th>
				<th>備考</th>
				<th>服用チェック</th>
				<th>更新</th>
				<th>削除</th>
			</tr>
			<tr th:each="task:${tasks}">
				<td th:text="${task.recordDay}"></td>
				<td th:text="${task.title}"></td>
				<td th:text="${task.level}"></td>
				<td th:text="${task.progress}"></td>
				<td th:text="${task.categories.name}"></td>
				<td th:text="${task.memo}"></td>
				<td>
					<form th:action="@{/tasks/{taskId}/done(taskId=${task.id})}" method="post">
						<button>飲んだ!</button>
					</form>
				</td>
				<td>
					<form th:action="@{/tasks/{taskId}/edit(taskId=${task.id})}" method="get">
						<button>更新</button>
					</form>
				</td>
				<td>
					<form th:action="@{/tasks/{taskId}/delete(taskId=${task.id})}" method="post"
						onsubmit="return checkDelete()">
						<button>削除</button>
					</form>
				</td>
			</tr>
		</table>
		<a href="/categories">カテゴリー一覧</a>
	</main>
	<footer th:replace="~{footer}"></footer>
	</div>
</body>
<script>
	function checkDelete() {
		if (confirm("削除しますか")) {
			return true;
		} else {
			return false;
		}
	}
</script>
</html>
