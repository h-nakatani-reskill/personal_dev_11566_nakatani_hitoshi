<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<div class="wrapper">
	<header th:replace="~{header}"></header>
	<main>
	<h1>カテゴリー一覧</h1>
	<a href="/tasks">タスク一覧</a>
	<table border="1">
		<tr>
			<th>カテゴリーID</th>
			<th>カテゴリー名</th>
			<th>変更</th>
			<th>更新</th>
		</tr>
		<tr th:each="category:${categories}">
			<td th:text="${category.id}"></td>
			<td th:text="${category.name}"></td>
			<td>
				<form th:action="@{/categories/{categoryId}/edit(categoryId=${category.id})}" method="get">
					<button>更新</button>
				</form>
			</td>
			<td>
				<form th:action="@{/categories/{categoryId}/delete(categoryId=${category.id})}" method="post">
					<button>削除</button>
				</form>
			</td>
		</tr>
	</table>
	<a href="/categories/add">カテゴリー追加</a>
	</main>
	<a href="/tasks/add">新規登録</a>
	<a href="/categories">カテゴリー一覧</a>
	<footer th:replace="~{footer}"></footer>
	</div>
</body>
</html>
