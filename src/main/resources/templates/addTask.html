<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>タスク追加</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<div class="wrapper">
	<header th:replace="~{header}"></header>
	<hr>
	<h1>お薬登録</h1>
	
	<form action="/tasks/add" method="post">
		<table border="1">
			<tr>
				<th>種類</th>
				<td><input type="text" name="title" placeholder="例：錠剤" th:value="${title}"></td>
			</tr>
			<tr>
				<th>カテゴリーID</th>
				<td>
					<select name="categoryId">
				    	<option th:each="category:${categories}" th:value="${category.id}" th:text="${category.name}"></option>
					</select>
				</td>
			</tr>
			<tr>
				<th>登録日</th>
				<td><input type="text" name="recordDay" placeholder="YYYY/MM/DD"></td>
			</tr>
			<tr>
				<th>残量</th>
				<td><input type="number" name="level" placeholder="60" value="60"></td>
			</tr>
			<tr>
				<th>服用量</th>
				<td><input type="number" name="progress" placeholder="2" value="60"></td>
			</tr>
			<tr>
				<th>飲むタイミング</th>
				<td><input type="text" name="memo" placeholder="毎食後3つ" th:value="${memo}"></td>
			</tr>
		</table>
		<button>登録</button>
		<br><span th:text="${message}" style="color: red"></span>
	</form>
	</main>
	<footer th:replace="~{footer}"></footer>
	</div>
</body>
</html>
