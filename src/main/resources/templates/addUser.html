<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>新規会員登録</h1>
	<form action="/login" method="post">
		<table border="1">
			<tr>
				<th>名前</th>
				<td><input name="name" placeholder="名前"></td>
			</tr>
			<tr>
				<th>メールアドレス</th>
				<td><input name="email" placeholder="メールアドレス"></td>
			</tr>
			<tr>
				<th>電話</th>
				<td><input name="password" placeholder="パスワード"></td>
			</tr>
		</table>
		<button>登録</button>
	</form>
</body>
</html>
